const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let elapsed=0,last=0,introStart=null;
const scale=700/1940,ox=50,oy=(480-480*scale)/2;
const x=ox+(20+5*.57)*scale,y=oy+(20+5*.57)*scale;
const size=758*.57*scale,radius=184*.57*scale,inset=10*.57*scale;
function loadingWeave(){
 const phase=elapsed/5200*Math.PI*2;
 const left=0,width=800,base=390;
 for(let lane=0;lane<2;lane++){
  const rgb=lane===0?'255,146,30':'245,246,248';
  const g=ctx.createLinearGradient(left,0,left+width,0);
  g.addColorStop(0,'rgba('+rgb+',0)');g.addColorStop(.25,'rgba('+rgb+',.55)');g.addColorStop(.5,'rgba('+rgb+',.85)');g.addColorStop(.75,'rgba('+rgb+',.55)');g.addColorStop(1,'rgba('+rgb+',0)');
  ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();
  for(let i=0;i<=320;i++){
   const t=i/320;const px=left+t*width;
   const py=base+Math.sin(t*Math.PI)*24*Math.sin(t*Math.PI*2-phase+lane*Math.PI);
   if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();
 }
}
function draw(){
 ctx.fillStyle='#101419';ctx.fillRect(0,0,800,480);

 const vignette=ctx.createRadialGradient(400,230,80,400,230,470);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.24)');ctx.fillStyle=vignette;ctx.fillRect(0,0,800,480);
 const breathe=.5-.5*Math.cos(elapsed/10400*Math.PI*2);
 const glow=ctx.createRadialGradient(400,248,25,400,248,330);
 glow.addColorStop(0,'rgba(105,117,132,'+(.025+breathe*.022)+')');glow.addColorStop(1,'rgba(105,117,132,0)');
 ctx.save();ctx.translate(0,80);ctx.scale(1,.68);ctx.fillStyle=glow;ctx.fillRect(0,0,800,700);ctx.restore();
 const intro=reduced?1:Math.min(1,introStart===null?0:(elapsed-introStart)/1200);
 const ease=1-Math.pow(1-intro,3);
 ctx.save();ctx.globalAlpha=ease;ctx.translate(0,(1-ease)*6);
 const angle=Math.PI/4+elapsed/10400*Math.PI*2;
 const cx=x+size/2,cy=y+size/2,reach=size*.70710678;
 const gradient=ctx.createLinearGradient(cx-Math.cos(angle)*reach,cy-Math.sin(angle)*reach,cx+Math.cos(angle)*reach,cy+Math.sin(angle)*reach);
 gradient.addColorStop(0,'#FF921E');gradient.addColorStop(.24,'#FF921E');gradient.addColorStop(.48,'#646A73');gradient.addColorStop(.68,'#646A73');gradient.addColorStop(1,'#F5F6F8');
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,size,size,radius);ctx.roundRect(x+inset,y+inset,size-2*inset,size-2*inset,174*.57*scale);ctx.clip('evenodd');ctx.fillStyle=gradient;ctx.fillRect(x-1,y-1,size+2,size+2);ctx.restore();

}
function frame(now){if(last&&!reduced)elapsed+=Math.min(now-last,100);last=now;draw();if(!reduced)requestAnimationFrame(frame);}
